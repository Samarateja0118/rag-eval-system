[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragsys"
version = "0.1.0"
description = "Hybrid-search RAG over SEC filings (FinanceBench) with a retrieval + generation eval harness"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11",
  "pypdfium2>=4.30",
  "onnxruntime>=1.18",
  "tokenizers>=0.19",
  "bm25s>=0.2.6",
  "PyStemmer>=2.2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "redis>=5.0",
  "httpx>=0.27",
  "lightgbm>=4.3",
]

[project.optional-dependencies]
llm = ["llama-cpp-python==0.3.36"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
ragsys = "ragsys.cli:main"

[tool.setuptools.packages.find]
include = ["ragsys*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: needs downloaded model files (skipped in CI by default)"]
